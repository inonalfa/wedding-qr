<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6d294b">
  <meta name="robots" content="noindex, nofollow">
  <title>הרגעים שלנו | בקרוב</title>
  <meta name="description" content="מקום קטן לרגע גדול.">
  <style>
    :root { font-family: "Segoe UI", Arial, sans-serif; color: #352331; background: #fcf8f9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { max-width: 540px; width: 100%; text-align: center; padding: 52px 28px 48px; border: 1px solid #e8d9df; border-radius: 24px; background: white; box-shadow: 0 18px 60px #6d294b0e; }
    .mark { color: #6d294b; font-size: 32px; margin-bottom: 20px; line-height: 1; }
    h1 { color: #6d294b; font-weight: 650; font-size: clamp(27px, 6vw, 37px); line-height: 1.3; margin: 0 0 16px; }
    p { margin: 0; line-height: 1.85; font-size: 17px; }
    .rule { width: 68px; height: 2px; background: #d1aabf; margin: 28px auto; }
    small { color: #866578; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♥</div>
    <h1>לרגעים שלא שוכחים</h1>
    <p>יש רגעים שרוצים לחזור אליהם שוב ושוב.<br>בקרוב הם יחכו לכם כאן.</p>
    <div class="rule" aria-hidden="true"></div>
    <small>מזכרת קטנה מרגע גדול</small>
  </main>
  <script>
    (async function () {
      try {
        const response = await fetch("./destination.json?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) return;
        const config = await response.json();
        if (typeof config.url !== "string" || !config.url.trim()) return;
        const destination = new URL(config.url.trim());
        if (destination.protocol !== "https:" && destination.protocol !== "http:") return;
        if (!destination.hostname) return;
        window.location.replace(destination.href);
      } catch (error) {
        console.warn("QR destination is not configured or available.");
      }
    })();
  </script>
</body>
</html>
